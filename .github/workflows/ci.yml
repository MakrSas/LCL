name: CI

# CI is our compiler. Development happens on Windows; this is the only macOS in the project.
#
# Speed is a feature here, because a slow pipeline is a slow development loop and there is no
# local alternative to fall back on. Three things keep it quick:
#   1. Docs-only pushes do not build at all (paths-ignore below).
#   2. Two jobs, not three — the old device-Debug `build` job duplicated what `ipa` already
#      proves, so it is gone.
#   3. DerivedData is cached, so mlx-swift + swift-syntax macros + Metal shaders are compiled
#      once per dependency graph rather than on every push.

on:
  push:
    branches: [main, "ai/**", "dev/**"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel on main: doing so once threw away a finished .ipa because a docs commit
  # landed while it was packaging. On main the artifact is the point of the run.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Pinned deliberately. Never `macos-latest` — a silent image bump we cannot reproduce
  # locally would be undebuggable from Windows.
  # Xcode 26.6 = iOS 26 SDK. The Xcode 27 image is still public preview and reportedly ships
  # without the Metal toolchain (actions/runner-images#14450), which MLX needs.
  XCODE_VERSION: "26.6"
  SCHEME: LCL
  PROJECT: LCL.xcodeproj
  # Bump to bust the DerivedData cache if it ever goes stale.
  CACHE_VERSION: v1

jobs:
  # Manual only, by the developer's decision: the simulator test job took 11+ minutes against
  # 78 seconds for the device build, and on a one-person project that cost more than it
  # returned. The tests themselves are kept and still work — run this job from the Actions tab
  # ("Run workflow") when a change touches the agent loop, the markdown parser, or anything
  # else whose failure would be silent rather than visible on screen.
  test:
    name: Test (iOS Simulator)
    runs-on: macos-26
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          xcodebuild -version

      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: .spm-cache
          key: spm-${{ env.XCODE_VERSION }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: spm-${{ env.XCODE_VERSION }}-

      # Split restore/save instead of actions/cache, because that only writes the cache when
      # the job SUCCEEDS. During active development failures are the normal case, so the
      # simulator cache never got written and this job was cold on every run — 11+ minutes
      # against 78 seconds for the device build, whose cache had been saved once.
      # Saving on failure too is what makes a red run cheap.
      - name: Restore DerivedData
        uses: actions/cache/restore@v4
        with:
          path: dd
          key: dd-${{ env.CACHE_VERSION }}-sim-${{ env.XCODE_VERSION }}-${{ hashFiles('**/Package.resolved') }}-
          restore-keys: |
            dd-${{ env.CACHE_VERSION }}-sim-${{ env.XCODE_VERSION }}-${{ hashFiles('**/Package.resolved') }}-
            dd-${{ env.CACHE_VERSION }}-sim-${{ env.XCODE_VERSION }}-

      # -skipPackagePluginValidation / -skipMacroValidation: SwiftPM build-tool plugins and
      # macros require an interactive trust prompt the first time. mlx-swift ships a
      # "CudaBuild" plugin and the graph pulls swift-syntax macros, so without these the
      # build stops at "Validate plug-in ..." and emits no error text at all.
      #
      # 2>&1 before tee: xcodebuild writes those failures to stderr, so a bare `| tee`
      # produces an empty diagnostics report — which is how that bug hid itself once.
      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            -derivedDataPath dd \
            -clonedSourcePackagesDirPath .spm-cache \
            -resultBundlePath test.xcresult \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            ONLY_ACTIVE_ARCH=YES \
            2>&1 | tee test.log

      # Unique key per run, matched by the restore-keys prefix above: cache/save refuses to
      # overwrite an existing key.
      - name: Save DerivedData
        if: always()
        uses: actions/cache/save@v4
        with:
          path: dd
          key: dd-${{ env.CACHE_VERSION }}-sim-${{ env.XCODE_VERSION }}-${{ hashFiles('**/Package.resolved') }}-${{ github.run_id }}

      - name: Extract diagnostics
        if: always()
        run: bash scripts/ci-diagnostics.sh test.xcresult test.log > diagnostics.md

      - name: Report
        if: always()
        run: cat diagnostics.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics
          path: |
            diagnostics.md
            test.log
          retention-days: 14

  # The developer's only route to a real device. Runs in parallel with `test` and depends on
  # nothing, so a failing test never withholds an installable build.
  #
  # Unsigned on purpose: the sideloading tool re-signs with the user's own certificate and
  # applies Increased Memory Limit from LCL/Resources/LCL.entitlements. Without that
  # entitlement a 6 GB iPhone will very likely Jetsam-kill the app on model load — see
  # docs/RESEARCH_LOG.md §9, which also explains why a direct SideStore install is preferred
  # over LiveContainer for this app.
  ipa:
    name: Unsigned IPA (sideload)
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: write # to publish the rolling prerelease below
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"

      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: .spm-cache
          key: spm-${{ env.XCODE_VERSION }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: spm-${{ env.XCODE_VERSION }}-

      - name: Restore DerivedData
        uses: actions/cache/restore@v4
        with:
          path: dd
          key: dd-${{ env.CACHE_VERSION }}-dev-${{ env.XCODE_VERSION }}-${{ hashFiles('**/Package.resolved') }}-
          restore-keys: |
            dd-${{ env.CACHE_VERSION }}-dev-${{ env.XCODE_VERSION }}-${{ hashFiles('**/Package.resolved') }}-
            dd-${{ env.CACHE_VERSION }}-dev-${{ env.XCODE_VERSION }}-

      - name: Build for device (Release, unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath dd \
            -clonedSourcePackagesDirPath .spm-cache \
            -resultBundlePath ipa.xcresult \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee ipa.log

      - name: Save DerivedData
        if: always()
        uses: actions/cache/save@v4
        with:
          path: dd
          key: dd-${{ env.CACHE_VERSION }}-dev-${{ env.XCODE_VERSION }}-${{ hashFiles('**/Package.resolved') }}-${{ github.run_id }}

      - name: Extract diagnostics
        if: always()
        run: bash scripts/ci-diagnostics.sh ipa.xcresult ipa.log > diagnostics.md

      - name: Report
        if: always()
        run: cat diagnostics.md >> "$GITHUB_STEP_SUMMARY"

      # An .ipa is just a zip with the .app inside a Payload/ directory.
      - name: Package .ipa
        run: |
          APP="dd/Build/Products/Release-iphoneos/LCL.app"
          test -d "$APP" || { echo "::error::$APP not found"; ls -R dd/Build/Products || true; exit 1; }
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry "LCL-${GITHUB_SHA:0:7}-unsigned.ipa" Payload
          {
            echo "### Sideload artifact"
            echo "\`LCL-${GITHUB_SHA:0:7}-unsigned.ipa\` — $(du -h *.ipa | cut -f1)"
            echo ""
            echo "Install with SideStore/AltStore (preferred — supports Increased Memory Limit"
            echo "and keeps the sandbox) or LiveContainer."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: LCL-unsigned-ipa
          path: "*.ipa"
          retention-days: 30

      # Actions artifacts are always served wrapped in a .zip, so on a phone you end up
      # unzipping a zip to get an .ipa that is itself a zip. Release assets are served
      # verbatim, and SideStore/AltStore can install straight from a URL — no unzipping and
      # no Files.app round trip.
      #
      # One rolling prerelease with a fixed tag and filename, so the download URL never
      # changes and can be bookmarked or pasted into SideStore once:
      #   https://github.com/${{ github.repository }}/releases/download/dev-latest/LCL.ipa
      - name: Publish rolling dev build
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp LCL-*.ipa LCL.ipa
          NOTES=$(printf '%s\n' \
            "Unsigned development build — install with SideStore/AltStore (preferred) or LiveContainer." \
            "" \
            "**Direct link (stable, always the newest build):**" \
            "\`https://github.com/${GITHUB_REPOSITORY}/releases/download/dev-latest/LCL.ipa\`" \
            "" \
            "Commit: \`${GITHUB_SHA}\`" \
            "" \
            "Needs the Increased Memory Limit entitlement applied at signing time —" \
            "without it a 6 GB iPhone will likely Jetsam-kill the app on model load." \
            "See docs/RESEARCH_LOG.md §9.")
          if gh release view dev-latest >/dev/null 2>&1; then
            gh release edit dev-latest --notes "$NOTES"
          else
            gh release create dev-latest --prerelease --title "LCL — dev build" --notes "$NOTES"
          fi
          gh release upload dev-latest LCL.ipa --clobber
          {
            echo "### Install"
            echo "\`\`\`"
            echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/dev-latest/LCL.ipa"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipa-diagnostics
          path: |
            diagnostics.md
            ipa.log
          retention-days: 14
